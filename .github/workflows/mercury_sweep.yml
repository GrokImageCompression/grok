name: Mercury Sweep
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  DATA_ROOT: ${{ github.workspace }}/data
  DATA_BRANCH: master

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libpsl-dev
        rustup toolchain install stable --profile minimal || curl https://sh.rustup.rs -sSf | sh -s -- -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        cmake -E make_directory ${{ github.workspace }}/build
        git clone --depth=1 --branch=${{ env.DATA_BRANCH }} https://github.com/GrokImageCompression/grok-test-data.git ${{ env.DATA_ROOT }}

    - name: configure cmake
      working-directory: ${{ github.workspace }}/build
      run: |
        cmake $GITHUB_WORKSPACE \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DBUILD_SHARED_LIBS=ON \
          -DBUILD_TESTING:BOOL=ON \
          -DGRK_DATA_ROOT=$DATA_ROOT \
          -DGRK_ENABLE_LIBCURL=OFF

    - name: build
      working-directory: ${{ github.workspace }}/build
      run: cmake --build . --config $BUILD_TYPE -j$(nproc)

    - name: assert mercury is in the build
      # without rust the library builds without mercury and every decode is
      # classic, turning the sweep into classic vs classic
      run: nm -D ${{ github.workspace }}/build/bin/libgrokj2k.so | grep -q mercury_warp_loom

    - name: runner cpu
      # hosted runners mix intel and amd, and mercury's kernels dispatch on cpu features
      run: lscpu

    - name: mercury a/b sweep
      run: |
        mkdir -p ${{ github.workspace }}/build/sweepwork
        python3 tests/mercury_ab_sweep.py \
          ${{ github.workspace }}/build/bin \
          ${{ github.workspace }}/build/sweepwork \
          ${{ env.DATA_ROOT }}/input/nonregression \
          ${{ env.DATA_ROOT }}/input/conformance

    - name: mercury a/b sweep under emulated avx512
      # hosted runners mix amd and intel cpus, so the avx512 kernels only run
      # on a lucky runner draw. sde forces them on every run. subset only,
      # emulation is slow. sde comes from a mirror, intel's page blocks curl.
      run: |
        curl -sSfL -o sde.tar.xz https://github.com/xtensor-stack/xsimd-testing-resources/releases/download/2.0.0/sde-external-9.48.0-2024-11-25-lin.tar.xz
        tar xf sde.tar.xz
        mkdir -p sde-bin sde-corpus build/sweepwork-avx512
        for f in nonregression/4bpp.j2k conformance/a3_mono.j2c \
                 conformance/b1_mono.j2c nonregression/b1_mono_4k.j2k \
                 nonregression/bit16_layer5.jp2 nonregression/boats_cprl.j2k \
                 nonregression/cinema129x129.jp2 conformance/file1.jp2 \
                 nonregression/foo_irrev.j2k nonregression/issue411-ycc444.jp2 \
                 conformance/p0_01.j2k nonregression/pacs.ge.j2k; do
          ln -s $DATA_ROOT/input/$f sde-corpus/
        done
        printf '#!/bin/bash\nexec %s/sde-external-9.48.0-2024-11-25-lin/sde64 -skx -- %s/build/bin/grk_decompress "$@"\n' "$PWD" "$PWD" > sde-bin/grk_decompress
        chmod +x sde-bin/grk_decompress
        ln -s ${{ github.workspace }}/build/bin/compare_images sde-bin/compare_images
        python3 tests/mercury_ab_sweep.py sde-bin build/sweepwork-avx512 sde-corpus

    - name: upload failing outputs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: sweep-failures
        path: |
          ${{ github.workspace }}/build/sweepwork
          ${{ github.workspace }}/build/sweepwork-avx512
        if-no-files-found: ignore
